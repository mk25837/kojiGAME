<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>こじげー３</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:10px;
    background:#111;
    color:white;
    font-family:Meiryo,sans-serif;
}

h1{
    text-align:center;
    color:#ffd700;
    margin:0 0 10px 0;
}

#game{
    max-width:1300px;
    margin:auto;
}

.top-area{
    display:flex;
    gap:10px;
    margin-bottom:10px;
}

.panel{
    background:#1d1d1d;
    border:2px solid #444;
    border-radius:8px;
    padding:10px;
}

.status-panel{
    flex:1;
}

.status-flex{
    display:flex;
    align-items:center;
    gap:10px;
}

.character-image{
    width:220px;
    height:220px;
    object-fit:contain;
    background:#000;
    border:2px solid #555;
    border-radius:8px;
}

.compact-text{
    font-size:14px;
    line-height:1.5;
    flex:1;
}

.command-panel{
    text-align:center;
    margin-bottom:10px;
}

button{
    background:#333;
    color:white;
    border:none;
    padding:10px 18px;
    margin:4px;
    cursor:pointer;
    font-size:15px;
    border-radius:5px;
}

button:hover{
    background:#555;
}

.main-area{
    display:flex;
    gap:10px;
}

.left-area{
    width:40%;
}

.right-area{
    width:60%;
}

.battle-log{
    height:450px;
    overflow-y:auto;
    background:black;
    padding:10px;
    border:1px solid #555;
    font-size:14px;
    line-height:1.4;
}

.cards{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    max-height:450px;
    overflow-y:auto;
}

.card{
    width:220px;
    border:2px solid #555;
    background:#222;
    padding:10px;
    border-radius:6px;
    font-size:14px;
}

.card h3{
    margin-top:0;
}

.equip{
    border:1px solid #555;
    background:#222;
    padding:4px;
    margin:4px 0;
    border-radius:4px;
    font-size:13px;
}

.rare-normal{
    color:white;
}

.rare-rare{
    color:#4da6ff;
}

.rare-epic{
    color:#c266ff;
}

.rare-legend{
    color:#ffd700;
}

@media(max-width:900px){

    .top-area{
        flex-direction:column;
    }

    .main-area{
        flex-direction:column;
    }

    .left-area,
    .right-area{
        width:100%;
    }

}

</style>
</head>

//////////////////////////////////////////////////
// ラスボス
//////////////////////////////////////////////////

const finalBoss = {

    name:"魔王",

    image:"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgkDZFHXugOEho62wp3nY9zo3SYl3qdbYwT_xh0jtLvUcD47vynnptKtmYKzkJLY5i4NFSdKvwgvZTCF1dhPyM-JXAe6ASgprYgpXr6pUsaoM-YCmXIN6gCZxoWDQm9GBlyhTeNyjkqfkZq/s800/fantasy_maou_devil.png"
};


//////////////////////////////////////////////////

const rarities = [

{
    name:"ノーマル",
    multi:1,
    class:"rare-normal"
},

{
    name:"レア",
    multi:1.2,
    class:"rare-rare"
},

{
    name:"エピック",
    multi:1.5,
    class:"rare-epic"
},

{
    name:"レジェンダリー",
    multi:2,
    class:"rare-legend"
}

];

//////////////////////////////////////////////////

const player = {

    maxHp:150,
    hp:150,

    baseAtk:15,
    baseDef:10,
    baseHeal:40,

    healCount:10,

    equips:[]
};

//////////////////////////////////////////////////

let floor = 1;
let enemy = {};
let frozen = false;
let rewardOpen = false;

//////////////////////////////////////////////////
// 敵生成
//////////////////////////////////////////////////

function createEnemy(){

    ////////////////////////////////////////////////
    // 7階はボス固定
    ////////////////////////////////////////////////

    let monster;

    if(floor === 7){

        monster = finalBoss;

    }else{

        monster = monsterPool[
            Math.floor(
                Math.random() * monsterPool.length
            )
        ];
    }

    ////////////////////////////////////////////////
    // ステータス
    ////////////////////////////////////////////////

    enemy = {

        name:monster.name,

        image:monster.image,

        hp:12 + floor * 60,
        maxHp:12 + floor * 60,

        atk:-6 + floor * 10,
        def:-12 + floor * 15
    };

    ////////////////////////////////////////////////
    // ボス強化
    ////////////////////////////////////////////////

    if(floor === 7){

        enemy.hp += 180;
        enemy.atk += 80;
        enemy.def += 17;
    }

    addLog("======================");
    addLog(`${floor}階`);
    addLog(`${enemy.name} が現れた！`);

    updateUI();
}



//////////////////////////////////////////////////
// ステータス
//////////////////////////////////////////////////

function totalAtk(){

    let atk = player.baseAtk;

    player.equips.forEach(e=>{

        if(e.type === "weapon"){
            atk += e.value;
        }

    });

    const berserk = player.equips.find(
        e=>e.effect==="berserk"
    );

    if(berserk && player.hp <= player.maxHp * 0.3){

        atk *= 1.5;
    }

    return Math.floor(atk);
}

function totalDef(){

    let def = player.baseDef;

    player.equips.forEach(e=>{

        if(e.type === "armor"){
            def += e.value;
        }

    });

    return Math.floor(def);
}

function totalHeal(){

    let heal = player.baseHeal;

    player.equips.forEach(e=>{

        heal += e.healBonus || 0;

    });

    return Math.floor(heal);
}

//////////////////////////////////////////////////
// 攻撃
//////////////////////////////////////////////////

function playerAttack(){

    if(player.hp <= 0) return;

    // 修正２
    if(rewardOpen) return;

    // 修正１
    if(enemy.hp <= 0) return;

    let damage = totalAtk() - enemy.def;

    if(damage < 1){
        damage = 1;
    }

    const criticalWeapon = player.equips.find(
        e=>e.effect==="critical"
    );

    if(criticalWeapon){

        if(Math.random() < 0.10){

            addLog("攻撃ミス！");
            enemyTurn();
            return;
        }

        if(Math.random() < 0.25){

            damage *= 2.5;

            addLog("会心の一撃！");
        }
    }

    const pierceWeapon = player.equips.find(
        e=>e.effect==="pierce"
    );

    if(pierceWeapon){

        damage += Math.floor(enemy.def * 0.3);
    }

    damage = Math.floor(damage);

    enemy.hp -= damage;

    // 修正１
    if(enemy.hp < 0){
        enemy.hp = 0;
    }

    addLog(`${damage} ダメージ！`);

    const doubleWeapon = player.equips.find(
        e=>e.effect==="double"
    );

    if(doubleWeapon && Math.random() < 0.15){

        let extra = Math.floor(damage * 0.8);

        enemy.hp -= extra;

        if(enemy.hp < 0){
            enemy.hp = 0;
        }

        addLog(`連撃！ ${extra} ダメージ！`);
    }

    const freezeWeapon = player.equips.find(
        e=>e.effect==="freeze"
    );

    if(freezeWeapon && Math.random() < 0.20){

        frozen = true;

        addLog("敵が凍結！");
    }

    updateUI();

    if(enemy.hp <= 0){

        addLog("敵を倒した！");

        rewardPhase();

        return;
    }

    enemyTurn();

    updateUI();
}

//////////////////////////////////////////////////
// 回復
//////////////////////////////////////////////////

function playerHeal(){

    if(player.hp <= 0) return;

    // 修正２
    if(rewardOpen) return;

    if(player.healCount <= 0){

        addLog("回復回数が残っていない！");
        return;
    }

    player.healCount--;

    let heal = totalHeal();

    const berserkArmor = player.equips.find(
        e=>e.effect==="berserk"
    );

    if(berserkArmor){

        heal = Math.floor(heal * 0.5);
    }

    player.hp += heal;

    if(player.hp > player.maxHp){
        player.hp = player.maxHp;
    }

    addLog(`${heal} HP回復！`);
    addLog(`残り回復回数: ${player.healCount}`);

    updateUI();

    enemyTurn();
}

//////////////////////////////////////////////////
// 敵ターン
//////////////////////////////////////////////////

function enemyTurn(){

    if(enemy.hp <= 0) return;

    if(frozen){

        addLog("敵は凍って動けない！");
        frozen = false;
        return;
    }

    let damage = enemy.atk - totalDef();

    if(damage < 1){
        damage = 1;
    }

    const reduceArmor = player.equips.find(
        e=>e.effect==="reduce"
    );

    if(reduceArmor){

        damage -= 5;
    }

    const guardArmor = player.equips.find(
        e=>e.effect==="guard"
    );

    if(guardArmor && player.hp >= player.maxHp * 0.5){

        damage *= 0.8;
    }

    const nullifyArmor = player.equips.find(
        e=>e.effect==="nullify"
    );

    if(nullifyArmor && Math.random() < 0.25){

        addLog("ダメージ無効！");
        return;
    }

    damage = Math.floor(damage);

    if(damage < 1){
        damage = 1;
    }

    player.hp -= damage;

    if(player.hp < 0){
        player.hp = 0;
    }

    addLog(`敵の攻撃！ ${damage} ダメージ`);

    if(player.hp <= 0){

        updateUI();

        addLog("ゲームオーバー");

        alert("ゲームオーバー");

        return;
    }

    updateUI();
}

//////////////////////////////////////////////////
// 報酬
//////////////////////////////////////////////////

function rewardPhase(){

    rewardOpen = true;

    const panel = document.getElementById("rewardPanel");
    const cards = document.getElementById("rewardCards");

    panel.style.display = "block";

    cards.innerHTML = "";

    for(let i=0;i<3;i++){

        const base = equipmentPool[
            Math.floor(Math.random()*equipmentPool.length)
        ];

        const rarity = rarities[
            Math.floor(Math.random()*rarities.length)
        ];

        const value = Math.floor(
            (Math.random()*50 + 1) * rarity.multi
        );

        const healBonus = Math.floor(
            Math.random() * 10
        );

        const equip = {

            ...base,

            value,
            healBonus,

            rarity:rarity.name,
            rarityClass:rarity.class
        };

        const div = document.createElement("div");

        div.className = "card";

        div.innerHTML = `

            <h3 class="${equip.rarityClass}">
                ${equip.name}
            </h3>

            <p>${equip.rarity}</p>

            <p>
                ${equip.type==="weapon" ? "攻撃" : "防御"}
                +${equip.value}
            </p>

            <p>
                回復 +${equip.healBonus}
            </p>

            <p>${equip.desc}</p>

            <button onclick='selectEquip(${JSON.stringify(equip)})'>
                選択
            </button>
        `;

        cards.appendChild(div);
    }
}

//////////////////////////////////////////////////
// 装備選択
//////////////////////////////////////////////////

function selectEquip(equip){

    //////////////////////////////////////////////////
    // 5個以上なら置き換えUI表示
    //////////////////////////////////////////////////

    if(player.equips.length >= 5){

        showReplaceMenu(equip);
        return;
    }

    //////////////////////////////////////////////////
    // 普通に装備
    //////////////////////////////////////////////////

    addEquip(equip);
}

//////////////////////////////////////////////////
// 装備追加共通処理
//////////////////////////////////////////////////

function addEquip(equip){

    player.equips.push(equip);

    addLog(`${equip.name} を装備！`);

    ////////////////////////////////////////////////
    // 戦闘後回復
    ////////////////////////////////////////////////

    if(equip.effect === "heal"){

        let heal = Math.floor(player.maxHp * 0.05);

        player.hp += heal;

        if(player.hp > player.maxHp){
            player.hp = player.maxHp;
        }

        addLog(`HPが${heal}回復`);
    }

    ////////////////////////////////////////////////
    // 次階層
    ////////////////////////////////////////////////

    floor++;

    rewardOpen = false;

    document.getElementById(
        "rewardPanel"
    ).style.display = "none";

    ////////////////////////////////////////////////
    // クリア
    ////////////////////////////////////////////////

    if(floor > 7){

        addLog("7階層クリア！");
        alert("ゲームクリア！");
        return;
    }

    createEnemy();

    updateUI();
}

//////////////////////////////////////////////////
// 装備入れ替えUI
//////////////////////////////////////////////////

function showReplaceMenu(newEquip){

    const cards = document.getElementById("rewardCards");

    cards.innerHTML = "";

    //////////////////////////////////////////////////
    // 新装備表示
    //////////////////////////////////////////////////

    const info = document.createElement("div");

    info.style.width = "100%";

    info.innerHTML = `
        <h3>装備がいっぱいです</h3>
        <p>
            捨てる装備を選択してください
        </p>

        <div class="card">

            <h3 class="${newEquip.rarityClass}">
                ${newEquip.name}
            </h3>

            <p>
                ${newEquip.type==="weapon" ? "攻撃" : "防御"}
                +${newEquip.value}
            </p>

            <p>
                回復 +${newEquip.healBonus}
            </p>

            <p>
                ${newEquip.desc}
            </p>

        </div>

        <hr>
    `;

    cards.appendChild(info);

    //////////////////////////////////////////////////
    // 現装備一覧
    //////////////////////////////////////////////////

    player.equips.forEach((oldEquip,index)=>{

        const div = document.createElement("div");

        div.className = "card";

        div.innerHTML = `

            <h3 class="${oldEquip.rarityClass}">
                ${oldEquip.name}
            </h3>

            <p>
                ${oldEquip.type==="weapon" ? "攻撃" : "防御"}
                +${oldEquip.value}
            </p>

            <p>
                回復 +${oldEquip.healBonus}
            </p>

            <p>
                [${oldEquip.rarity}]
            </p>

            <button onclick='replaceEquip(${index}, ${JSON.stringify(newEquip)})'>
                この装備を捨てる
            </button>
        `;

        cards.appendChild(div);
    });

    //////////////////////////////////////////////////
    // スキップ
    //////////////////////////////////////////////////

    const skip = document.createElement("div");

    skip.className = "card";

    skip.innerHTML = `

        <h3>装備しない</h3>

        <p>
            今の装備を維持する
        </p>

        <button onclick="skipEquip()">
            スキップ
        </button>
    `;

    cards.appendChild(skip);
}

//////////////////////////////////////////////////
// 装備交換
//////////////////////////////////////////////////

function replaceEquip(index,newEquip){

    const removed = player.equips[index];

    addLog(`${removed.name} を捨てた`);

    player.equips.splice(index,1);

    addEquip(newEquip);
}

//////////////////////////////////////////////////
// スキップ
//////////////////////////////////////////////////

function skipEquip(){

    addLog("装備を見送った");

    floor++;

    rewardOpen = false;

    document.getElementById(
        "rewardPanel"
    ).style.display = "none";

    if(floor > 7){

        addLog("7階層クリア！");
        alert("ゲームクリア！");
        return;
    }


    createEnemy();

    updateUI();
}

//////////////////////////////////////////////////
// UI
//////////////////////////////////////////////////

function updateUI(){

    document.getElementById(
        "playerStatus"
    ).innerHTML = `

        HP: ${player.hp} / ${player.maxHp}<br>
        攻撃: ${totalAtk()}<br>
        防御: ${totalDef()}<br>
        回復: ${totalHeal()}<br>
        回復回数: ${player.healCount} / 10<br>
        階層: ${floor}<br><br>

        <b>装備</b><br>

        ${
            player.equips.map(e=>`

                <div class="equip ${e.rarityClass}">

                    ${e.name}<br>

                    ${e.type==="weapon" ? "攻撃" : "防御"}
                    +${e.value}<br>

                    回復+${e.healBonus}<br>

                    [${e.rarity}]

                </div>

            `).join("")
        }
    `;

    document.getElementById(
        "enemyStatus"
    ).innerHTML = `

        ${enemy.name}<br><br>

        HP: ${enemy.hp} / ${enemy.maxHp}<br>

        攻撃: ${enemy.atk}<br>

        防御: ${enemy.def}
    `;
    
    
    //////////////////////////////////////////////////
// 敵画像更新
//////////////////////////////////////////////////

document.getElementById(
    "enemyImage"
).src = enemy.image;


    
    
}

//////////////////////////////////////////////////
// ログ
//////////////////////////////////////////////////

function addLog(text){

    const log = document.getElementById("log");

    log.innerHTML += text + "<br>";

    log.scrollTop = log.scrollHeight;
}

//////////////////////////////////////////////////
// 開始
//////////////////////////////////////////////////



createEnemy();

</script>
